<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insights.gg Transcript</title>
  <style>
    body{margin:0;padding:18px;width:260px;background:#11131a;color:#f4f4f8;font:14px/1.45 Arial,sans-serif}
    h1{font-size:16px;margin:0 0 8px}p{margin:0 0 14px;color:#b7bac8;font-size:12px}
    button{width:100%;border:0;border-radius:8px;padding:11px 12px;background:#6558f5;color:white;font-weight:700;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}.hint{margin-top:12px;font-size:11px;color:#9296a8}
  </style>
</head>
<body>
  <h1>VOD Transcript</h1>
  <p>Open a transcript window for the current Insights.gg VOD.</p>
  <button id="open" type="button">Open transcript</button>
  <div class="hint" id="hint">Open a VOD page first. Enable YouTube CC if captions do not appear.</div>
  <script src="popup.js"></script>
</body>
</html>
